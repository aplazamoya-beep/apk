name: Android APK Builder
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
      - name: Instalar herramientas
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP"
            ls -la
            exit 1
          fi
          echo "Extrayendo: $ZIP_FILE"
          mkdir -p proyecto
          unzip -o "$ZIP_FILE" -d proyecto
          echo "Contenido extraído:"
          find proyecto -maxdepth 3 -type f | head -n 50

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AX-Game-Switch-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
