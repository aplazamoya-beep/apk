```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: unzip -o AX_Game_Switch_Version_Prototype_v0.1.zip -d proyecto

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AX-Game-Switch-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
```
