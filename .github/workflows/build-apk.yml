name: Android APK Builder
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
      - name: Instalar herramientas
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: unzip -o AX_Game_Switch_Version_Prototype_v0.1.zip -d proyecto

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AX-Game-Switch-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
